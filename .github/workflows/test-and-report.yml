name: Tests and Xray Report

on:
  push:
    branches: [ version-4 ]
  pull_request:
    branches: [ version-4 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run tests with Maven
        run: mvn clean verify
        working-directory: ./api-spring-boot/api_etudiant
      - name: Publish results to Xray
        env:
          XRAY_TOKEN: ${{ secrets.XRAY_TOKEN }}
        run: |
          curl -H "Content-Type: multipart/form-data" \
               -H "Authorization: Bearer $XRAY_TOKEN" \
               -F "file=@./api-spring-boot/api_etudiant/target/surefire-reports/TEST-*.xml" \
               "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=GDE"