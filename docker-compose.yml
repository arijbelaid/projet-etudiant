services:
  # ==================== BASES DE DONNÉES ====================
  db:
    image: postgres:15
    container_name: etudiant_postgres
    environment:
      POSTGRES_DB: etudiantdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: etudiant_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: auth_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # ==================== SERVICE DISCOVERY (EUREKA) ====================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - app-network

  # ==================== MICROSERVICES ====================
  etudiant-service:
    build: ./api-spring-boot/api_etudiant
    container_name: etudiant-service
    ports:
      - "8081:8081"
    depends_on:
      - db
      - redis
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/etudiantdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - app-network

  grading-service:
    build: ./grading-service
    container_name: grading-service
    ports:
      - "8082:8082"
    depends_on:
      - db
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/etudiantdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - app-network

  # ==================== API GATEWAY ====================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - app-network

  # ==================== FRONTEND NEXT.JS ====================
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - app-network

  # ==================== SERVICE D'AUTHENTIFICATION ====================
  auth-service:
    build: ./auth-service
    container_name: auth_service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: super_secret_key_change_me_please
      PORT: 3001
    networks:
      - app-network

# ==================== RÉSEAU ====================
networks:
  app-network:
    driver: bridge

# ==================== VOLUMES PERSISTANTS ====================
volumes:
  postgres_data:
  mongodb_data: